[workspace]
members = ["proto", "switch-proto", "vardevall", "tun", "ffi", "jni", "switch", "tls-pq"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
rust-version = "1.96"

[workspace.dependencies]
vardevall-proto = { path = "proto" }
vardevall-switch-proto = { path = "switch-proto" }
vardevall-tls-pq = { path = "tls-pq" }
vardevall = { path = "vardevall" }
vardevall-tun = { path = "tun", default-features = false }
vardevall-switch = { path = "switch" }

anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
libc = "0.2"
ml-kem = { version = "0.3", default-features = false, features = ["zeroize"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand_core = "0.10"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = "1"
serde_json = "1"
simple-dns = "0.12"
subtle = { version = "2", default-features = false }
thiserror = "2"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
toml = "1"
toml_edit = "0.22"
zeroize = "1"

[profile.ios]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
