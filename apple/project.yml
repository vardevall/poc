name: Vardevall

options:
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settingGroups:
  app:
    PRODUCT_NAME: vardevall
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: ""
  tunnel:
    PRODUCT_NAME: vardevall-tunnel
    SKIP_INSTALL: YES

targets:
  VardevallIOS:
    type: application
    platform: iOS
    sources: [Shared, App]
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).vardevall
        INFOPLIST_FILE: Resources/App-iOS.plist
        CODE_SIGN_ENTITLEMENTS: Resources/iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: VardevallTunnelIOS
      - framework: Frameworks/Vardevall.xcframework
        embed: false

  VardevallTunnelIOS:
    type: app-extension
    platform: iOS
    sources: [Shared, Tunnel]
    settings:
      groups: [tunnel]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).vardevall.tunnel
        INFOPLIST_FILE: Resources/Tunnel.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Tunnel-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - framework: Frameworks/Vardevall.xcframework
        embed: false

  VardevallMac:
    type: application
    platform: macOS
    sources: [Shared, App]
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).vardevall.mac
        INFOPLIST_FILE: Resources/App-macOS.plist
        CODE_SIGN_ENTITLEMENTS: Resources/macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: VardevallTunnelMac
      - framework: Frameworks/Vardevall.xcframework
        embed: false

  VardevallTunnelMac:
    type: app-extension
    platform: macOS
    sources: [Shared, Tunnel]
    settings:
      groups: [tunnel]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).vardevall.mac.tunnel
        INFOPLIST_FILE: Resources/Tunnel.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Tunnel-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - framework: Frameworks/Vardevall.xcframework
        embed: false

schemes:
  VardevallIOS:
    build:
      targets:
        VardevallIOS: all
  VardevallMac:
    build:
      targets:
        VardevallMac: all
