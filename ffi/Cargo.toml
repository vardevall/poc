[package]
name = "vardevall-ffi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "C interface of the vardevall engine for the Apple apps."
publish = false

[lib]
name = "vardevall_ffi"
crate-type = ["staticlib"]

[dependencies]
vardevall-tun.workspace = true
libc.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
cbindgen = { version = "0.29", default-features = false }
