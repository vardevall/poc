# Optional: coturn instead of the embedded TURN server of vv-switch (vv-04 §4.5). Leave out
# [turn.server] in switch.toml; the switch then only issues credentials and coturn relays. static-auth-secret must equal `secret` in the [turn] section of
# switch.toml (generate one with `openssl rand -base64 32`).

listening-port=3478
use-auth-secret
static-auth-secret=change-me
realm=switch.example.org

# Privacy: the switch keeps no logs about users, so neither does coturn: nothing on stdout, nothing
# in a file, no admin CLI, no Prometheus metrics (they carry per-user labels).
no-stdout-log
# syslog is left off (it is off by default)
log-file=/dev/null
no-cli
no-prometheus
no-software-attribute

# TURN over TLS on port 443 shared with the switch (RFC 7443) is only available with the embedded
# server; this file serves UDP only.
no-tls
no-dtls

# Never relay into private networks.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Operator policy, to be advertised as `bits_per_second` and `bytes` in switch.toml.
max-bps=1250000
user-quota=4
total-quota=1000
min-port=49152
max-port=65535
