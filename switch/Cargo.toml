[package]
name = "vardevall-switch"
version = "0.0.0"
edition.workspace = true
license = "AGPL-3.0-only"
rust-version.workspace = true
description = "vv-switch: the vardevall rendezvous and forwarding server (vv-04)."
publish = false

[features]
default = ["stun-turn"]
stun-turn = []

[lib]
name = "vardevall_switch"

[[bin]]
name = "vv-switch"
path = "src/main.rs"

[dependencies]
vardevall-proto.workspace = true
vardevall-switch-proto.workspace = true
vardevall-tls-pq.workspace = true
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
getrandom.workspace = true
http.workspace = true
http-body = "1"
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["tokio", "server-auto", "http1", "http2"] }
rustls.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
tokio-rustls.workspace = true
toml.workspace = true
zeroize.workspace = true
h3.workspace = true
h3-quinn.workspace = true
futures-util = { version = "0.3", default-features = false }
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "webpki-roots"] }
quinn-proto = { version = "0.11", default-features = false }
quinn.workspace = true
arc-swap = "1"
rcgen.workspace = true
subtle = { workspace = true, features = ["std", "i128"] }
ipnet = "2"

[dev-dependencies]
rcgen = { workspace = true, features = ["pem"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "test-util", "io-util"] }
hyper = { workspace = true, features = ["http1", "http2", "client"] }
hyper-util = { workspace = true, features = ["tokio", "server-auto", "http1", "http2", "client"] }
